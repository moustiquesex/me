<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="editor-token" content="EDITOR_TOKEN"><title>Espace auteur — Idriss Bouhière</title><link rel="stylesheet" href="/editor.css"><script src="/editor.js" defer></script></head><body><header><h1>Espace auteur</h1><p>Idriss Bouhière · édition sur cet ordinateur</p></header><main><aside><button id="new">Nouvelle publication</button><label>Publications<select id="posts"><option value="">Choisir</option></select></label><p>Enregistrer conserve le texte sur cet ordinateur. Envoyer transmet les publications et les PDF au dépôt public.</p><a href="https://github.com/moustiquesex/me/actions" target="_blank" rel="noopener noreferrer">Suivi de publication</a></aside><section><div class="metadata"><label>Identifiant URL<input id="slug" placeholder="titre-de-la-publication" maxlength="100"></label><label>Date<input id="date" type="date"></label><label>Format<select id="type"><option value="analysis">Article / analyse</option><option value="research">Recherche</option><option value="note">Commentaire / actualité</option></select></label><label>Discipline<select id="discipline"><option value="European affairs">Affaires européennes</option><option value="Security and defence">Sécurité et défense</option><option value="International relations">Relations internationales</option><option value="History">Histoire</option></select></label><label>Diffusion<select id="access"><option value="none">Texte uniquement</option><option value="public">PDF intégré et texte optionnel</option><option value="request">PDF sur demande</option></select></label><label>PDF public, 10 Mio maximum<input id="upload" type="file" accept="application/pdf,.pdf"><span id="pdf-name"></span></label><label>Lien original (facultatif)<input id="source" type="url"></label><label>Organisme éditeur (facultatif)<input id="publisher"></label></div><div class="tabs"><button data-lang="fr" aria-pressed="true">Français</button><button data-lang="en" aria-pressed="false">English</button></div><label>Titre<input id="title"></label><label>Résumé public<textarea id="summary" rows="4"></textarea></label><div class="toolbar" aria-label="Mise en forme"><select id="block" aria-label="Taille et niveau de titre"><option value="p">Paragraphe</option><option value="h2">Titre de section</option><option value="h3">Sous-titre</option></select><select id="size" aria-label="Taille du texte"><option value="text-normal">Normal</option><option value="text-small">Petit</option><option value="text-large">Grand</option></select><button data-command="bold">Gras</button><button data-command="italic">Italique</button><button data-command="insertUnorderedList">Liste</button><button data-command="justifyLeft">Gauche</button><button data-command="justifyCenter">Centré</button><button data-command="justifyRight">Droite</button><button data-command="justifyFull">Justifié</button><button id="link">Lien</button></div><div id="body" contenteditable="true" role="textbox" aria-label="Texte de la publication" aria-multiline="true"></div><label><input id="published" type="checkbox">Afficher sur le site</label><div class="actions"><button id="save">Enregistrer sur cet ordinateur</button><button id="publish">Envoyer vers le site</button></div><p id="status" role="status"></p></section></main></body></html>
